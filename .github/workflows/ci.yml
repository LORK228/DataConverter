name: DataConverter CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache

      - name: Install dependencies & tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja ccache

      - name: Install dependencies & tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja ccache

      - name: Setup Compiler Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure CMake
        run: >
          cmake -B "${{ env.BUILD_DIR }}"
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build project
        run: cmake --build "${{ env.BUILD_DIR }}" --config ${{ matrix.build_type }} --parallel

      - name: Run unit tests
        run: ctest --test-dir "${{ env.BUILD_DIR }}" -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Upload Binary Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: data-converter-bin-${{ matrix.os }}
          path: |
            ${{ env.BUILD_DIR }}/DataConverter
            ${{ env.BUILD_DIR }}/DataConverter.exe
          if-no-files-found: ignore